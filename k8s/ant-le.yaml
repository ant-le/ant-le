apiVersion: v1
kind: Namespace
metadata:
  name: ant-le
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ant-le
  namespace: ant-le
  labels:
    app.kubernetes.io/name: ant-le
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ant-le
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ant-le
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: ghcr.io/ant-le/ant-le@sha256:9ea5bc1cf78c85c8eb4c2ed4676c007fc69669ebde383f0147d6d7b2bc0af082
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ORIGIN
              value: https://antonlechuga.com
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            - name: ADDRESS_HEADER
              value: x-forwarded-for
            - name: XFF_DEPTH
              value: '1'
            - name: PGHOST
              value: postgres.database.svc.cluster.local
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: comments-db
                  key: database
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: comments-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: comments-db
                  key: password
            - name: COMMENTS_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: comments-db
                  key: hash-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ant-le
  namespace: ant-le
spec:
  selector:
    app.kubernetes.io/name: ant-le
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ant-le
  namespace: ant-le
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - antonlechuga.com
        - www.antonlechuga.com
  rules:
    - host: antonlechuga.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ant-le
                port:
                  name: http
    - host: www.antonlechuga.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ant-le
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ant-le
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: ant-le
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ant-le
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-kube-system
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: ant-le
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ant-le
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: ant-le
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ant-le
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
