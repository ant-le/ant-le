apiVersion: v1
kind: Namespace
metadata:
  name: ant-le
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# checkov:skip=CKV_K8S_15:The image is built locally and imported directly into containerd by OpenTofu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ant-le
  namespace: ant-le
  labels:
    app.kubernetes.io/name: ant-le
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ant-le
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ant-le
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: ghcr.io/ant-le/ant-le:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ant-le
  namespace: ant-le
spec:
  selector:
    app.kubernetes.io/name: ant-le
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ant-le
  namespace: ant-le
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - antonlechuga.com
        - www.antonlechuga.com
      secretName: ant-le-tls
  rules:
    - host: antonlechuga.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ant-le
                port:
                  name: http
    - host: www.antonlechuga.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ant-le
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ant-le
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: ant-le
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ant-le
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
