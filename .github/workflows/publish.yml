name: Publish to GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - k8s/**
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment digest
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'k8s/ant-le.yaml';
          const manifest = readFileSync(path, 'utf8');
          const imagePattern = /image: ghcr\.io\/ant-le\/ant-le\S+/;
          if (!imagePattern.test(manifest)) throw new Error('Deployment image reference was not found');
          const updated = manifest.replace(
            imagePattern,
            `image: ghcr.io/ant-le/ant-le@${process.env.IMAGE_DIGEST}`,
          );
          writeFileSync(path, updated);
          EOF

      - name: Commit deployment digest
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add k8s/ant-le.yaml
          git diff --cached --quiet || git commit -m "chore: deploy ${GITHUB_SHA::12} [skip ci]"
          git push
